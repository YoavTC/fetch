name: Create Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g. 1.1)'
        required: true
        type: string
      minecraft_versions:
        description: 'Supported Minecraft versions (e.g. 26.1 or 26.2-26.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REPO_NAME: ${{ github.event.repository.name }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      MINECRAFT_VERSIONS: ${{ inputs.minecraft_versions }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install beet
        run: pip install beet

      - name: Bump version in project files
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Invalid release version '$RELEASE_VERSION' (expected e.g. 1.1 or 1.1.2)"
            exit 1
          fi

          # package.json / package-lock.json require full semver (X.Y.Z), so pad e.g. 1.1 -> 1.1.0
          IFS=. read -r major minor patch <<< "$RELEASE_VERSION"
          SEMVER="${major}.${minor:-0}.${patch:-0}"

          # src/pack.mcmeta
          jq --tab --arg text "$REPO_NAME v$RELEASE_VERSION"$'\n' \
            '.pack.description[0].text = $text' \
            src/pack.mcmeta > pack.mcmeta.tmp
          mv pack.mcmeta.tmp src/pack.mcmeta

          # beet.yml
          if grep -q '^version:' beet.yml; then
            sed -i "s/^version:.*/version: $SEMVER/" beet.yml
          else
            sed -i "/^author:.*/a version: $SEMVER" beet.yml
          fi

          # package.json
          jq --tab --arg v "$SEMVER" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

          # package-lock.json (top-level version and the root package entry)
          jq --tab --arg v "$SEMVER" '.version = $v | .packages[""].version = $v' \
            package-lock.json > package-lock.json.tmp
          mv package-lock.json.tmp package-lock.json

          git diff

      - name: Commit and push version bump
        run: |
          FILES="src/pack.mcmeta beet.yml package.json package-lock.json"
          if git diff --quiet -- $FILES; then
            echo "Version files already at v$RELEASE_VERSION, nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "Release v$RELEASE_VERSION"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build pack
        run: |
          beet build -j > build.json
          jq -e '.status == "success"' build.json > /dev/null

      - name: Extract data pack zip
        run: |
          ASSET_NAME="${REPO_NAME}_v${RELEASE_VERSION}_MC${MINECRAFT_VERSIONS}.zip"
          ASSET_NAME="${ASSET_NAME// /_}"
          jq -r '.data_pack.zip' build.json | base64 -d > "$ASSET_NAME"
          unzip -l "$ASSET_NAME"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        run: |
          gh release create "v$RELEASE_VERSION" \
            "$ASSET_NAME" \
            --target "$RELEASE_SHA" \
            --title "$REPO_NAME v$RELEASE_VERSION" \
            --notes "Supports Minecraft $MINECRAFT_VERSIONS"